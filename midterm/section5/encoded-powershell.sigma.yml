title: Suspicious Encoded PowerShell
id: 6b853767-af09-4fcf-81ac-5122241f9511
status: experimental
description: Detects PowerShell commands using encoded arguments.
author: Jacob Miller, IA 462 Student
date: 2026-11-23

logsource:
  product: windows
  service: security
  category: process_creation

detection:
  selection:
    EventID: 4688
    NewProcessName|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
  condition: selection

falsepositives:
  - Legitimate administrator scripts

level: high

tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027